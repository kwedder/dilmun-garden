name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish each APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Name the packages: the action's default includes the legacy "tools"
      # package, which current SDK managers no longer have.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Sign every build with the same key, so a new APK installs over the old
      # one and keeps its log. The key comes from repository secrets; see README.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DILMUN_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DILMUN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dilmun.jks"
            echo "DILMUN_KEYSTORE=$RUNNER_TEMP/dilmun.jks" >> "$GITHUB_ENV"
            echo "DILMUN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "::warning::No DILMUN_KEYSTORE_B64 secret. This APK is signed with a throwaway debug key, so it can't be installed over a build signed with a different key."
          fi

      - name: Core tests
        run: gradle --no-daemon :core:coreTest

      - name: Build the APK
        run: gradle --no-daemon :app:assembleDebug

      # Every build is published as a pre-release with the APK attached, so it
      # can be downloaded from the Releases page (release assets don't count
      # against the account's Actions artifact storage).
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          tag="apk-${GITHUB_RUN_NUMBER}-${short}"
          cp app/build/outputs/apk/debug/app-debug.apk "dilmun-portal-${short}.apk"
          gh release create "$tag" "dilmun-portal-${short}.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Dilmun portal APK · ${GITHUB_REF_NAME} · ${short}" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Core tests passed before this build."

      # Also kept as a workflow artifact when storage allows; a full quota doesn't fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dilmun-portal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
