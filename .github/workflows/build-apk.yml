name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_TAG: b11160

jobs:
  # The core (log, arbiters, gate, model agent) and the native model layer,
  # tested on Linux with a tiny random-weight model. Fast, and catches most
  # breakage before the slower Android build finishes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Core tests
        run: |
          mkdir -p build/core
          javac -encoding UTF-8 -d build/core $(find core/src -name '*.java')
          java -cp build/core app.dilmun.core.CoreTest

      - name: Build the native model layer for Linux
        run: |
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cmake -S app/src/main/cpp -B build/native -DLLAMA_DIR="$RUNNER_TEMP/llama.cpp" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target dilmun_llm -j 4

      - name: Native model tests
        run: |
          pip install numpy pyyaml sentencepiece
          python tools/make_tiny_gguf.py "$RUNNER_TEMP/llama.cpp" build/tiny.gguf
          python tools/make_tiny_gguf.py "$RUNNER_TEMP/llama.cpp" build/tiny-chatml.gguf --template
          LIB=$(find build/native -name 'libdilmun_llm.so' | head -1)
          export LD_LIBRARY_PATH="$(find build/native -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
          java -Ddilmun.llm="$PWD/$LIB" -cp build/core app.dilmun.core.LlamaTest build/tiny.gguf build/tiny-chatml.gguf

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: NDK and CMake
        run: sdkmanager --install "ndk;29.0.13113456" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Sign every build with the same key, so a new APK installs over the old
      # one and keeps its log. The key comes from repository secrets; see README.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DILMUN_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DILMUN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dilmun.jks"
            echo "DILMUN_KEYSTORE=$RUNNER_TEMP/dilmun.jks" >> "$GITHUB_ENV"
            echo "DILMUN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "::warning::No DILMUN_KEYSTORE_B64 secret. This APK is signed with a throwaway debug key, so it can't be installed over a build signed with a different key."
          fi

      - name: Build the APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dilmun-portal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
