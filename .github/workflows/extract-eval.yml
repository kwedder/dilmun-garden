name: Extraction check on a real text

# Runs the real model through the real arbiters over OpenStax "Introduction to
# Anthropology" (CC BY-NC-SA 4.0, fetched at run time, never stored here) and
# prints every fact it proposed with the verdict: kept, or refused and why.
# By hand from the Actions tab, or when this file changes.
on:
  workflow_dispatch:
    inputs:
      modules:
        description: OpenStax module ids (space-separated)
        default: "m00001 m00002 m00003 m00004"
      file:
        description: Model file name pattern
        default: Q4_K_M
  push:
    paths:
      - .github/workflows/extract-eval.yml

permissions:
  contents: read

env:
  LLAMA_TAG: b11160
  REPO: openbmb/MiniCPM5-1B-GGUF

jobs:
  eval:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the core and the native model layer
        run: |
          mkdir -p build/core
          javac -encoding UTF-8 -d build/core $(find core/src -name '*.java')
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cmake -S app/src/main/cpp -B build/native -DLLAMA_DIR="$RUNNER_TEMP/llama.cpp" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target dilmun_llm -j 4

      - name: Fetch the text
        env:
          MODULES: ${{ inputs.modules || 'm00001 m00002 m00003 m00004' }}
        run: |
          git clone --depth 1 https://github.com/openstax/osbooks-introduction-anthropology "$RUNNER_TEMP/book"
          files=""
          for m in $MODULES; do files="$files $RUNNER_TEMP/book/modules/$m/index.cnxml"; done
          python3 tools/cnxml_to_text.py text $files
          wc -c text/*

      - name: Download the model
        env:
          PAT: ${{ inputs.file || 'Q4_K_M' }}
        run: |
          mkdir -p models
          curl -fsSL "https://huggingface.co/api/models/$REPO" -o models/index.json
          name=$(python3 -c "import json,sys; fs=[s['rfilename'] for s in json.load(open('models/index.json'))['siblings'] if s['rfilename'].endswith('.gguf') and sys.argv[1].lower() in s['rfilename'].lower()]; print(fs[0] if fs else '')" "$PAT")
          test -n "$name"
          curl -fL --retry 3 "https://huggingface.co/$REPO/resolve/main/$name" -o "models/$(basename "$name")"

      - name: Extract
        run: |
          LIB=$(find build/native -name 'libdilmun_llm.so' | head -1)
          export LD_LIBRARY_PATH="$(find build/native -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
          java -Ddilmun.llm="$PWD/$LIB" -cp build/core app.dilmun.core.ExtractEval models/*.gguf text | tee eval.txt

      - uses: actions/upload-artifact@v4
        with:
          name: extract-eval
          path: |
            eval.txt
            text/
