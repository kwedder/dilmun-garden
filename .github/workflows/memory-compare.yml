name: Memory comparison

# Dilmun against the memory policies of plain RAG, Mem0 and MemoryBank
# (small reimplementations, see MemoryCompare.java) on the same inputs and
# the same context budget: questions over OpenStax "Introduction to
# Anthropology" (CC BY-NC-SA 4.0, fetched at run time, never stored here),
# an injected instruction, conflicting values, copied notes, and three years
# without use. No model runs: what's compared is the memory policy.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/memory-compare.yml
      - tools/memory-compare.json
      - core/src/test/java/app/dilmun/core/MemoryCompare.java
      - core/src/main/java/app/dilmun/core/Engine.java
      - core/src/main/java/app/dilmun/core/State.java
      - core/src/main/java/app/dilmun/core/Grounding.java
      - core/src/main/java/app/dilmun/core/Agent.java

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the core
        run: |
          mkdir -p build/core
          javac -encoding UTF-8 -d build/core $(find core/src -name '*.java')

      - name: Fetch the text
        run: |
          git clone --depth 1 https://github.com/openstax/osbooks-introduction-anthropology "$RUNNER_TEMP/book"
          files=""
          for m in m00001 m00002 m00003 m00004 m00005 m00006 m00007 m00008; do files="$files $RUNNER_TEMP/book/modules/$m/index.cnxml"; done
          python3 tools/cnxml_to_text.py text $files

      - name: Compare
        run: |
          java -Dfile.encoding=UTF-8 -cp build/core app.dilmun.core.CoreTest | tail -1
          java -Dfile.encoding=UTF-8 -cp build/core app.dilmun.core.MemoryCompare text tools/memory-compare.json | tee compare.txt
          sed -n '/^COMPARE/,$p' compare.txt >> "$GITHUB_STEP_SUMMARY"
