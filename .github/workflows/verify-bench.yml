name: Verifier bench

# Which small local model makes a trustworthy verifier for the arbiters?
# Each model gets the same labelled sentence pairs (tools/verify-bench.json)
# and the same two questions a review asks, under the yes/no grammar, then a
# real review of claims from OpenStax "Introduction to Anthropology" (fetched
# at run time). Only files under 1.5 GB are tried. Runs by hand, or when the
# bench or the verifier changes.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-bench.yml
      - tools/verify-bench.json
      - core/src/test/java/app/dilmun/core/VerifyBench.java
      - core/src/main/java/app/dilmun/core/Verifier.java

permissions:
  contents: read

env:
  LLAMA_TAG: b11160
  MAX_BYTES: "1500000000"

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MiniCPM5-1B
            repo: openbmb/MiniCPM5-1B-GGUF
          - name: Qwen3-1.7B
            repo: unsloth/Qwen3-1.7B-GGUF
          - name: LFM2-1.2B
            repo: LiquidAI/LFM2-1.2B-GGUF
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find the Q4_K_M file (under 1.5 GB)
        id: find
        env:
          REPO: ${{ matrix.repo }}
        run: |
          curl -fsSL "https://huggingface.co/api/models/$REPO?blobs=true" -o index.json
          python3 - <<'PY'
          import json, os
          d = json.load(open("index.json"))
          fs = [s for s in d.get("siblings", []) if s["rfilename"].lower().endswith(".gguf") and "q4_k_m" in s["rfilename"].lower()
                and "-of-" not in s["rfilename"]]
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if not fs:
              print("::warning::no Q4_K_M .gguf in " + os.environ["REPO"]); out.write("file=\n"); raise SystemExit(0)
          fs.sort(key=lambda s: len(s["rfilename"]))          # the plain file, not a variant ("...-hip-optimized")
          f = fs[0]; size = f.get("size") or (f.get("lfs") or {}).get("size") or 0
          print(f"{f['rfilename']}: {size/1e9:.2f} GB")
          if size and size >= int(os.environ["MAX_BYTES"]):
              print("::warning::" + f["rfilename"] + " is 1.5 GB or more; skipped"); out.write("file=\n"); raise SystemExit(0)
          out.write("file=" + f["rfilename"] + "\n")
          PY

      - name: Build the core and the native model layer
        if: steps.find.outputs.file != ''
        run: |
          mkdir -p build/core
          javac -encoding UTF-8 -d build/core $(find core/src -name '*.java')
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cmake -S app/src/main/cpp -B build/native -DLLAMA_DIR="$RUNNER_TEMP/llama.cpp" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target dilmun_llm -j 4

      - name: Download the model
        if: steps.find.outputs.file != ''
        env:
          REPO: ${{ matrix.repo }}
          FILE: ${{ steps.find.outputs.file }}
        run: |
          mkdir -p models
          curl -fL --retry 3 "https://huggingface.co/$REPO/resolve/main/$FILE" -o "models/$(basename "$FILE")"
          ls -la models

      - name: Bench
        if: steps.find.outputs.file != ''
        run: |
          LIB=$(find build/native -name 'libdilmun_llm.so' | head -1)
          export LD_LIBRARY_PATH="$(find build/native -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
          java -Ddilmun.llm="$PWD/$LIB" -cp build/core app.dilmun.core.VerifyBench models/*.gguf tools/verify-bench.json | tee bench.txt

      - name: Answer a question with a known answer
        if: steps.find.outputs.file != ''
        run: |
          LIB=$(find build/native -name 'libdilmun_llm.so' | head -1)
          export LD_LIBRARY_PATH="$(find build/native -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
          java -Ddilmun.llm="$PWD/$LIB" -cp build/core app.dilmun.core.ModelSmoke models/*.gguf

      - name: Review real claims
        if: steps.find.outputs.file != ''
        run: |
          git clone --depth 1 https://github.com/openstax/osbooks-introduction-anthropology "$RUNNER_TEMP/book"
          files=""
          for m in m00001 m00002 m00003 m00004; do files="$files $RUNNER_TEMP/book/modules/$m/index.cnxml"; done
          python3 tools/cnxml_to_text.py text $files
          LIB=$(find build/native -name 'libdilmun_llm.so' | head -1)
          export LD_LIBRARY_PATH="$(find build/native -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)"
          java -Ddilmun.llm="$PWD/$LIB" -Ddilmun.extract=rules -cp build/core app.dilmun.core.ExtractEval models/*.gguf text | grep -E "^(Claims|Review|VERDICT)" | tee review.txt
